# Seed cases for the typo checker's deterministic pass (check_typos with llm=None).
#
# The sentences marked "clean" are taken from the Bank Indonesia releases in sample_data/
# (the M2 May 2026 release and the banking/consumer survey wording), with PDF line-break
# artifacts smoothed out. They exist to hold PRECISION to account: report vocabulary is full
# of things a naive spell checker mangles -- English financial terms in parentheses,
# abbreviations like DPK/SBT/yoy, and M1/M2 -- and a false accusation on one of those sends a
# reader to verify something that was never wrong.
#
# The "damaged" sentences take the same wording and introduce exactly one kind of error the
# deterministic rules are supposed to own: a curated tidak-baku spelling, or a reduplication
# written with a space instead of a hyphen.
#
# NOT covered here, on purpose: free-form misspellings ("Likuidiaftas"). Those are unknown to
# the id_ID dictionary, which means tier 5 escalates them to the LLM, and with no LLM they are
# dropped. See eval/typo_dataset.py -- that recall belongs to a layer that does not exist yet,
# and pretending otherwise here would just paint a green number over a real gap.

# --------------------------------------------------------------------------- precision
- id: clean_m2_growth_bullet
  description: "The release's headline growth sentence: percentages, (yoy), Rp figures, M2"
  text: "Pada Mei 2026, M2 tumbuh sebesar 10,8% (yoy), lebih tinggi dibandingkan pertumbuhan April 2026 sebesar 9,2% (yoy) sehingga mencapai Rp10.415,9 triliun."
  expect_flagged: []
  expect_clean: ["yoy", "M2", "triliun", "dibandingkan"]

- id: clean_likuiditas_definition
  description: "The standing definition sentence every M2 release opens with"
  text: "Likuiditas perekonomian atau uang beredar dalam arti luas (M2) pada Mei 2026 tumbuh lebih tinggi."
  expect_flagged: []
  expect_clean: ["Likuiditas", "perekonomian", "beredar"]

- id: clean_english_financial_terms
  description: >
    The footnote defining what "kredit" excludes, carrying four English terms inside
    parentheses. An Indonesian dictionary knows none of them; none may be reported.
  text: "Kredit yang diberikan hanya dalam bentuk Pinjaman (Loans), dan tidak termasuk instrumen keuangan yang dipersamakan dengan pinjaman, seperti surat berharga (Debt Securities), tagihan akseptasi (Bankers Acceptances), dan Tagihan Repo."
  expect_flagged: []
  expect_clean: ["Loans", "Debt", "Securities", "Acceptances", "Repo"]

- id: clean_survey_abbreviations
  description: "Survey wording: DPK and SBT are standard BI abbreviations, not misspellings"
  text: "Penghimpunan DPK pada Juni 2026 tercatat tumbuh 8,1% (yoy), dengan SBT permintaan kredit baru sebesar 82,3%."
  expect_flagged: []
  expect_clean: ["DPK", "SBT", "Penghimpunan"]

# --------------------------------------------------------------------------- recall
- id: tidak_baku_resiko
  description: "'resiko' for 'risiko' -- the most common non-standard spelling in this domain"
  text: "Bank Indonesia terus memantau resiko likuiditas perbankan pada triwulan II 2026."
  expect_flagged:
    - {word: "resiko", category: tidak_baku, suggestion: "risiko"}
  expect_clean: ["likuiditas", "perbankan", "triwulan"]

- id: tidak_baku_two_words_in_one_sentence
  description: >
    Two curated words in one sentence, one of them capitalised at the start. Both must be
    reported: stopping at the first would leave the second in the document.
  text: "Analisa terhadap sistim pembayaran nasional menunjukkan perbaikan."
  expect_flagged:
    - {word: "Analisa", category: tidak_baku, suggestion: "analisis"}
    - {word: "sistim", category: tidak_baku, suggestion: "sistem"}
  expect_clean: ["pembayaran", "menunjukkan"]

- id: grammar_reduplication_written_with_a_space
  description: >
    Indonesian plural reduplication takes a hyphen. Written with a space it is two ordinary
    words, each spelled correctly, so only a rule about the PAIR can catch it.
  text: "Bank bank umum mencatat pertumbuhan kredit yang stabil pada Mei 2026."
  expect_flagged:
    - {word: "Bank bank", category: grammar, suggestion: "Bank-bank"}
  expect_clean: ["mencatat", "pertumbuhan", "stabil"]

- id: tidak_baku_praktek_capitalised
  description: "'Praktek' for 'praktik', capitalised -- the match must not be case-sensitive"
  text: "Praktek pencatatan tersebut telah sesuai dengan standar akuntansi."
  expect_flagged:
    - {word: "Praktek", category: tidak_baku, suggestion: "praktik"}
  expect_clean: ["pencatatan", "akuntansi"]
