  expected:
    verdict: Entailed
    computed_value: 10253.6519

- id: no_conflict_between_a_levels_table_and_a_growth_table
  description: >
    A BI report carries the same series, under the SAME row label, as a level (Miliar Rp)
    and as %-yoy growth. The two numbers are nothing alike, but they measure different
    quantities — flagging that as the sources disagreeing would fire on nearly every claim.
  tables:
    - title: "Uang Beredar dan faktor-faktor yang mempengaruhinya"
      unit: "Miliar Rp"
      filename: "TABEL1_1.xls"
      sheet: "I.1"
      data:
        - {label: "Uang Beredar Luas(M2)", year: 2026, month: Apr, value: 10253651.888}
    - title: "Pertumbuhan Uang Beredar"
      unit: "%, yoy"
      filename: "TABEL1_19.xls"
      sheet: "I.19"
      data:
        - {label: "Uang Beredar Luas(M2)", year: 2026, month: Apr, value: 8.5}
  fact:
    operation: value
    unit: "triliun Rp"
    claimed_value: 10253.7
    context_quote: "M2 pada April 2026 tercatat sebesar Rp10.253,7 triliun"
    periods:
      - {metric_label: "Uang Beredar Luas(M2)", year: 2026, month: Apr}
  expected:
    verdict: Entailed
    computed_value: 10253.6519

- id: no_conflict_from_a_looser_label_match
  description: >
    The second source answers only through a broader row ('… Bank Umum'), a weaker claim to
    be the same series. A looser match is a different series, not a second reading of this
    one, so its number must neither contradict the winner nor be printed beside it.
  tables:
    - title: "Uang Beredar dan faktor-faktor yang mempengaruhinya"
      unit: "Miliar Rp"
      filename: "TABEL1_1.xls"
      sheet: "I.1"
      data:
        - {label: "Uang Beredar Luas(M2)", year: 2026, month: Apr, value: 10253651.888}
    - title: "Uang Beredar dan faktor-faktor yang mempengaruhinya"
      unit: "Miliar Rp"
      filename: "TABEL1_1.xls"
      sheet: "I.2"
      data:
        - {label: "Uang Beredar Luas(M2) Bank Umum", year: 2026, month: Apr, value: 9800000.0}
  fact:
    operation: value
    unit: "triliun Rp"
    claimed_value: 10253.7
    context_quote: "M2 pada April 2026 tercatat sebesar Rp10.253,7 triliun"
    periods:
      - {metric_label: "Uang Beredar Luas(M2)", year: 2026, month: Apr}
  expected:
    verdict: Entailed
    computed_value: 10253.6519
