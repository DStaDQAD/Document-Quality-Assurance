publication: shpr
title: Survei Harga Properti Residensial (SHPR)
conventions:
  - 'Indeks Harga Properti Residensial (IHPR) di pasar primer. TABEL 1 = nasional per tipe rumah (KECIL, MENENGAH, BESAR, TOTAL); TABEL 2 = indeks per kota; TABEL 3 = pertumbuhan per kota dengan dua blok: TRIWULANAN (QTQ) dan TAHUNAN (YOY).'
  - '"tumbuh X% (qtq)" atau "secara triwulanan" → blok TRIWULANAN (QTQ); "(yoy)" atau "secara tahunan" → blok TAHUNAN (YOY). Keduanya operation value unit persen.'
  - '"terkontraksi X%" berarti −X.'
  - 'Klaim penjualan properti, KPR dan pembiayaan ditulis dengan nama yang dipakai kalimat.'
phrases:
  - '"IHPR", "harga properti residensial" → TOTAL; "rumah tipe kecil/menengah/besar" → KECIL/MENENGAH/BESAR.'
periods:
  - 'Kolom triwulan Q1-Q4; "triwulan sebelumnya" dan "triwulan yang sama tahun sebelumnya" sesuai blok QTQ/YOY.'
units_signs:
  - 'Indeks (2018=100); pertumbuhan dalam persen.'
