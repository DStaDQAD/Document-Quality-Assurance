publication: npi
title: Neraca Pembayaran Indonesia (NPI)
conventions:
  - 'Tabel NPI memakai BPM6: sisi debit (Impor, Pembayaran) dan saldo defisit dicatat NEGATIF. Laporan menulis besarnya tanpa tanda: "defisit transaksi berjalan 12,5 miliar dolar AS" adalah value 12,5 atas saldo yang negatif; tulis angkanya tanpa tanda minus.'
  - '"defisit ... meningkat/melebar" berarti besarnya defisit membesar; "menyempit/menurun" berarti mengecil. "impor ... meningkat" berarti besarnya impor naik.'
  - '"tetap mencatat surplus" adalah level di atas 0 (above_threshold 0); "mencatat defisit" adalah di bawah 0.'
  - '"transaksi modal dan finansial" dengan satu angka adalah jumlah dua baris (Transaksi Modal + Transaksi Finansial) → operation sum.'
  - '"rasio defisit transaksi berjalan ... tetap terjaga" berarti masih pada tingkat aman, bukan tidak berubah; jangan jadikan is_stable kecuali kalimat bilang "stabil".'
  - '"setara 5,6 bulan impor atau 5,4 bulan impor dan pembayaran utang luar negeri pemerintah": dua angka untuk dua baris berbeda.'
phrases:
  - '"neraca perdagangan barang" (dan "surplus neraca perdagangan barang") → baris Transaksi Berjalan > Barang, saldo seluruh barang termasuk Barang Lainnya; BUKAN Barang Dagangan Umum (Tw II-2026: Barang 1,3 dan 8,2 seperti laporan, Barang Dagangan Umum 2,0 dan 10,2).'
  - '"neraca perdagangan nonmigas" → baris Neraca perdagangan nonmigas (memorandum); BUKAN Barang Dagangan Umum > Nonmigas (Tw II-2026: memorandum 11,5 dan 13,3 seperti laporan, Barang Dagangan Umum > Nonmigas 12,1 dan 15,3).'
  - '"neraca jasa" → Jasa-jasa; "pendapatan primer/sekunder" → baris Pendapatan Primer/Sekunder di Transaksi Berjalan.'
  - '"investasi langsung", "investasi portofolio", "investasi lainnya" → baris di Transaksi Finansial; "sisi kewajiban/aset" memilih Kewajiban atau Aset di bawahnya; "pasar surat utang" → anak baris Surat utang.'
  - '"aliran masuk/keluar modal asing" adalah sisi kewajiban; "arus masuk/keluar neto" adalah baris neto komponen itu.'
  - '"(% PDB)" → baris rasio terhadap PDB (hanya ada untuk transaksi berjalan).'
  - '"... bulan impor dan pembayaran utang luar negeri pemerintah" (angka kedua, Tw II-2026: 5,4) → baris Dalam Bulan Impor dan Pembayaran Utang Luar Negeri Pemerintah. Angka pertama (5,6) adalah bulan impor saja.'
  - 'Di paragraf investasi portofolio, "sektor publik" dan "sektor swasta" (juga "aliran dana asing portofolio sektor swasta", Grafik 20) adalah saldo neto per sektor: baris Investasi Portofolio Sektor Swasta/Publik (aset + kewajiban), BUKAN sisi kewajiban saja (Tw II-2026: swasta 3,3 dan 3,1, publik 13,0 cocok dengan aset + kewajiban). Kalimat yang menyebut "sisi kewajiban" atau "sisi aset" memakai baris sisi itu.'
  - '"impor gas" → baris Gas > Impor (tercatat negatif).'
periods:
  - 'Kolom triwulan Q1-Q4. "posisi pada akhir Juni" pada baris triwulanan = Q2.'
units_signs:
  - 'Tabel dalam Juta USD; laporan dalam miliar dolar AS (1 miliar = 1.000 juta).'
  - '"pembelian neto"/"penjualan neto" menunjukkan tanda arus, bukan rincian baris. "Pembelian neto surat berharga di luar negeri 1,5" dan "net outflow 3,1" menyebut BESARNYA arus yang di tabel negatif: size_of_negative = true.'
  - 'Harga minyak (USD/barel) dan volume (juta barel, MMBTU) bukan baris nilai USD.'
translation:
  - 'Neraca Pembayaran Indonesia (NPI) = Indonesia''s balance of payments (BOP)'
  - 'transaksi berjalan (TB) = current account; transaksi modal dan finansial (TMF) = capital and financial account (CFA)'
  - 'neraca perdagangan barang / jasa = goods / services trade balance; migas = oil and gas; nonmigas = non-oil and gas'
  - 'pendapatan primer / sekunder = primary / secondary income'
  - 'investasi langsung / portofolio / lainnya = direct / portfolio / other investment; PMA = FDI'
  - 'cadangan devisa = reserve assets; LLD (Lalu Lintas Devisa) = ITRS (International Transaction Reporting System)'
  - 'SUN = Government Debt Securities (SUN); SBN = Government Securities; Pekerja Migran Indonesia (PMI) = Indonesian migrant workers'
